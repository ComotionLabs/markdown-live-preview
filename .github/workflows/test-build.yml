# Verify skill packaging and md-document Python tests on every push / PR.

name: Test build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill package
        run: ./claude_skills/build_skill.sh md-document

      - name: Verify skill artifact
        run: test -s claude_skills/build/md-document.skill

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libcairo2 \
            libjpeg-turbo8 libopenjp2-7 libffi-dev shared-mime-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: claude_skills/md-document/requirements-dev.txt

      - name: Install Python test dependencies
        run: pip install -r claude_skills/md-document/requirements-dev.txt

      - name: Run md-document tests
        working-directory: claude_skills/md-document
        run: pytest tests/ -v

      - name: Build theme example PDFs (all themes × document & presentation)
        run: ./scripts/build-theme-examples.sh

      - name: Verify theme example artifacts
        run: |
          for f in \
            build/examples/comotion-document.pdf \
            build/examples/comotion-presentation.pdf \
            build/examples/comotion-ai-document.pdf \
            build/examples/comotion-ai-presentation.pdf \
            build/examples/seedanalytics-document.pdf \
            build/examples/seedanalytics-presentation.pdf \
            build/examples/comotion-presentation-notes.pdf \
            build/examples/comotion-ai-presentation-notes.pdf \
            build/examples/seedanalytics-presentation-notes.pdf; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
