# Build the Claude skill and publish it as an artifact.
# - On release: build the skill and attach the .skill file to the release.
#   GitHub only allows adding assets to draft releases, so create a DRAFT release
#   first; this workflow runs, uploads the asset, then you can publish the release.
# - Manual run: build the skill and upload as a workflow artifact (download from run Summary).

name: Deploy skill

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill
        run: ./claude_skills/build_skill.sh md-document

      - name: Upload skill as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-document.skill
          path: claude_skills/build/md-document.skill

      - name: Fail if release is already published
        if: github.event_name == 'release' && github.event.release.draft == false
        run: |
          echo "::error::Cannot upload assets to an already-published release. Create the release as a DRAFT first, run this workflow, then publish the release."
          exit 1

      - name: Upload skill to Release
        if: github.event_name == 'release' && github.event.release.draft == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: claude_skills/build/md-document.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
