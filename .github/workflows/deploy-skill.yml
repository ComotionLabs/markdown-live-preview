# Build the Claude skill and theme-example PDFs; publish the skill and examples zip on tagged releases.
#
# Recommended: tag push (e.g. v1.2.0). Build runs first; creating the GitHub release
# waits for approval on the "release" environment (configure required reviewers under
# Repo Settings → Environments → release).
#
# Manual run: build only; download md-document.skill and md-document-theme-examples.zip from Artifacts.

name: Deploy skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill
        run: ./claude_skills/build_skill.sh md-document

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libcairo2 \
            libjpeg-turbo8 libopenjp2-7 libffi-dev shared-mime-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: claude_skills/md-document/requirements-dev.txt

      - name: Install Python dependencies for PDF examples
        run: pip install -r claude_skills/md-document/requirements-dev.txt

      - name: Build theme example PDFs (document & presentation per theme)
        run: ./scripts/build-theme-examples.sh

      - name: Zip theme example PDFs
        run: |
          (cd build/examples && zip -r ../md-document-theme-examples.zip .)
          test -s build/md-document-theme-examples.zip

      - name: Upload skill as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-document.skill
          path: claude_skills/build/md-document.skill

      - name: Upload theme examples zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-document-theme-examples
          path: build/md-document-theme-examples.zip

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download built skill
        uses: actions/download-artifact@v4
        with:
          name: md-document.skill
          path: release-asset

      - name: Download theme examples zip
        uses: actions/download-artifact@v4
        with:
          name: md-document-theme-examples
          path: release-examples

      - name: Resolve release asset paths
        id: assets
        run: |
          skill=$(find release-asset -type f \( -name 'md-document.skill' -o -name '*.skill' \) | head -1)
          examples=$(find release-examples -type f -name '*.zip' | head -1)
          echo "Skill: $skill"
          echo "Examples zip: $examples"
          test -n "$skill" && test -f "$skill"
          test -n "$examples" && test -f "$examples"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

      - name: Create release with skill and example PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.assets.outputs.skill }}
            ${{ steps.assets.outputs.examples }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
