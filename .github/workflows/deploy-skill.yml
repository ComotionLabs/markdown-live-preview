# Build the Claude skill and publish it as an artifact.
#
# Recommended: tag push (no race with "Publish")
#   GitHub cannot lock draft releases — anyone can publish before CI finishes.
#   Instead: push an annotated tag, e.g. git tag v1.2.0 && git push origin v1.2.0
#   This workflow builds first, then creates a PUBLISHED release with the .skill
#   attached in one step, so there is no draft for someone to publish early.
#
# Manual run: build only; download md-document.skill from the run Summary (Artifacts).

name: Deploy skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill
        run: ./claude_skills/build_skill.sh md-document

      - name: Upload skill as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-document.skill
          path: claude_skills/build/md-document.skill

      - name: Create release with skill asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: claude_skills/build/md-document.skill
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
