# Build the Claude skill and publish it as an artifact.
#
# Recommended: tag push (e.g. v1.2.0). Build runs first; creating the GitHub release
# waits for approval on the "release" environment (configure required reviewers under
# Repo Settings → Environments → release).
#
# Manual run: build only; download md-document.skill from the run Summary (Artifacts).

name: Deploy skill

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build skill
        run: ./claude_skills/build_skill.sh md-document

      - name: Upload skill as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-document.skill
          path: claude_skills/build/md-document.skill

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download built skill
        uses: actions/download-artifact@v4
        with:
          name: md-document.skill
          path: release-asset

      - name: Resolve skill file path
        id: skill
        run: |
          f=$(find release-asset -type f \( -name 'md-document.skill' -o -name '*.skill' \) | head -1)
          echo "Found: $f"
          test -n "$f" && test -f "$f"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Create release with skill asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.skill.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
